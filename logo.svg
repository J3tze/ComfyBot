<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4aafff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Chat bubble body -->
  <rect x="16" y="20" width="96" height="72" rx="20" ry="20" fill="url(#bg)"/>
  <!-- Chat bubble tail -->
  <path d="M 36 92 Q 30 108 22 112 Q 36 106 48 96 Z" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect x="16" y="20" width="96" height="72" rx="20" ry="20" fill="url(#shine)"/>

  <!-- Left eye -->
  <ellipse cx="48" cy="52" rx="8" ry="9" fill="#fff"/>
  <ellipse cx="50" cy="53" rx="4.5" ry="5" fill="#1a1a2e"/>
  <circle cx="51.5" cy="50.5" r="2" fill="#fff"/>

  <!-- Right eye -->
  <ellipse cx="80" cy="52" rx="8" ry="9" fill="#fff"/>
  <ellipse cx="82" cy="53" rx="4.5" ry="5" fill="#1a1a2e"/>
  <circle cx="83.5" cy="50.5" r="2" fill="#fff"/>

  <!-- Smile -->
  <path d="M 52 68 Q 64 78 76 68" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Antenna -->
  <line x1="64" y1="20" x2="64" y2="8" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="6" r="4" fill="#a78bfa"/>
  <circle cx="64" cy="5" r="1.5" fill="#d4b5ff"/>

  <!-- Node dots (ComfyUI style) -->
  <circle cx="14" cy="40" r="3.5" fill="#4aafff" opacity="0.6"/>
  <circle cx="14" cy="56" r="3.5" fill="#a78bfa" opacity="0.6"/>
  <circle cx="114" cy="40" r="3.5" fill="#4aafff" opacity="0.6"/>
  <circle cx="114" cy="56" r="3.5" fill="#a78bfa" opacity="0.6"/>

  <!-- Tiny connection lines from node dots -->
  <line x1="17.5" y1="40" x2="22" y2="40" stroke="#4aafff" stroke-width="1.5" opacity="0.4"/>
  <line x1="17.5" y1="56" x2="22" y2="56" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
  <line x1="106" y1="40" x2="110.5" y2="40" stroke="#4aafff" stroke-width="1.5" opacity="0.4"/>
  <line x1="106" y1="56" x2="110.5" y2="56" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>

  <!-- Cheek blush -->
  <ellipse cx="40" cy="66" rx="6" ry="3.5" fill="#ff8fab" opacity="0.3"/>
  <ellipse cx="88" cy="66" rx="6" ry="3.5" fill="#ff8fab" opacity="0.3"/>
</svg>
